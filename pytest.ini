[tool:pytest]
# Test discovery configuration
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Python path configuration
pythonpath = .

# Test execution options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=youtrack_mcp
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch

# Async support
asyncio_mode = auto

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning:youtrack_mcp.*

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (mocked external services)
    e2e: End-to-end tests (real external services)
    docker: Docker container tests
    api: Tests that interact with external APIs
    mcp: MCP protocol compliance tests
    async: Asynchronous tests
    slow: Slow running tests

# Coverage configuration
[coverage:run]
source = youtrack_mcp
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod 