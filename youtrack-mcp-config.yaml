# YouTrack MCP Server Configuration
# This file contains all configuration options for the YouTrack MCP server
# Environment variables take precedence over these YAML values

# =============================================================================
# YOUTRACK CONNECTION SETTINGS
# =============================================================================

# YouTrack instance configuration
youtrack:
  # Self-hosted YouTrack instance URL (leave empty for cloud instances)
  # For self-hosted: "https://youtrack.yourcompany.com"
  # For cloud: "https://yourworkspace.youtrack.cloud"
  url: ""

  # API authentication token
  # For cloud instances: "perm:username.workspace.12345..."
  # For self-hosted: "perm:your_api_token"
  api_token: ""

  # Alternative: Path to file containing API token (more secure)
  # token_file: "/secure/path/to/youtrack-token"

  # SSL/TLS verification (set to false for self-signed certificates)
  verify_ssl: true

  # Cloud instance flag (automatically detected if URL is empty)
  cloud: false

# =============================================================================
# API CLIENT CONFIGURATION
# =============================================================================

# API client behavior settings
api:
  # Number of retry attempts for failed requests
  max_retries: 3

  # Initial delay between retries in seconds
  retry_delay: 1.0

# =============================================================================
# MCP SERVER CONFIGURATION
# =============================================================================

# MCP (Model Context Protocol) server settings
mcp:
  # Server identification
  server_name: "youtrack-mcp"
  server_description: "YouTrack MCP Server"

  # Debug mode (enables detailed logging)
  debug: false

  # Parameter repair (attempts to fix invalid parameters)
  param_repair: false

  # Transport protocol (usually "stdio" for MCP)
  transport: "stdio"

  # YouTrack capabilities (auto-detected)
  # caps: ""

# =============================================================================
# AI/LLM CONFIGURATION
# =============================================================================

# AI and Large Language Model settings
ai:
  # Enable AI features
  enabled: false

  # Maximum memory usage for AI models in MB
  max_memory_mb: 2048

  # OpenAI-compatible API provider (highest priority)
  llm:
    # API endpoint URL
    api_url: "https://api.openai.com/v1"

    # API authentication key
    api_key: ""

    # Model name to use
    model: "gpt-3.5-turbo"

    # Maximum tokens in response
    max_tokens: 1000

    # Response creativity (0.0 = deterministic, 1.0 = creative)
    temperature: 0.3

    # Request timeout in seconds
    timeout: 30

    # Enable this LLM provider
    enabled: false



  # Local model support (future feature)
  local:
    # Path to local model files
    model_path: ""

    # Enable local model provider
    enabled: false

# =============================================================================
# OAUTH2 CONFIGURATION (OPTIONAL)
# =============================================================================

# OAuth2 authentication (for enterprise deployments)
oauth2:
  # Enable OAuth2 authentication
  enabled: false

  # OAuth2 client credentials
  client_id: ""
  client_secret: ""

  # OAuth2 endpoints
  token_endpoint: ""
  authorization_endpoint: ""
  userinfo_endpoint: ""
  jwks_uri: ""
  issuer: ""

  # OAuth2 scope
  scope: "openid profile"

  # Grant type
  grant_type: "client_credentials"

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================

# Caching settings for performance optimization
cache:
  # Enable caching
  enabled: true

  # Cache time-to-live in seconds
  ttl: 300

  # Maximum cache size
  max_size: 100

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

# Logging settings
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"

  # Optional log file path (leave empty for console output)
  file: ""

# =============================================================================
# CONNECTION POOLING
# =============================================================================

# HTTP connection settings
connection:
  # Connection pool size
  pool_size: 10

  # Connection timeout in seconds
  timeout: 30

  # Read timeout in seconds
  read_timeout: 60

# =============================================================================
# RATE LIMITING
# =============================================================================

# Rate limiting to respect YouTrack API limits
rate_limit:
  # Enable rate limiting
  enabled: true

  # Maximum requests per period
  requests: 100

  # Time period in seconds
  period: 60

# =============================================================================
# USER PREFERENCES
# =============================================================================

# User interface and display preferences
preferences:
  # Date format for display
  date_format: "%Y-%m-%d"

  # DateTime format for display
  datetime_format: "%Y-%m-%d %H:%M:%S"

  # Timezone for date/time display
  timezone: "America/Chicago"

  # Maximum description length before truncation
  max_description_length: 500

  # Truncate long text fields
  truncate_long_text: true

  # Show issue URLs in responses
  show_issue_url: false

  # Default query context
  default_query_context: "me"

  # Default state filter for queries
  default_state_filter: "Open"

# =============================================================================
# FEATURE FLAGS
# =============================================================================

# Experimental and advanced features
features:
  # Enable natural language search
  natural_language_search: false

  # Enable smart suggestions
  smart_suggestions: false

  # Enable activity analysis features
  activity_analysis: false

  # Enable automatic field detection
  auto_field_detection: false

  # Enable batch operations
  batch_operations: false

  # Enable async processing
  async_processing: false

  # Enable advanced caching layer
  caching_layer: false

# =============================================================================
# LEGACY/DEPRECATED SETTINGS
# =============================================================================

# Legacy settings (maintained for backward compatibility)
legacy:
  # Response formatting quirks
  quirks:
    # Convert epoch timestamps to ISO8601
    no_epoch: true

  # Ticket suggestions (legacy feature)
  suggestions:
    enabled: false

# =============================================================================
# CONFIGURATION FILE SETTINGS
# =============================================================================

# Configuration file management
config:
  # Path to this configuration file (auto-detected)
  file: ""

  # Configuration file search paths
  search_paths:
    - "./config.yaml"
    - "../config.yaml"
    - "./youtrack-mcp.yaml"
    - "~/.config/youtrack-mcp.yaml"
    - "/etc/youtrack-mcp/config.yaml"

# =============================================================================
# SECURITY SETTINGS
# =============================================================================

# Security-related configuration
security:
  # SSL context settings
  ssl:
    # Verify SSL certificates
    verify: true

    # SSL certificate file (optional)
    cert_file: ""

    # SSL key file (optional)
    key_file: ""

  # Token security
  token:
    # Lazy loading of tokens
    lazy_load: true

    # Token validation
    validate: true

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================

# Development and debugging settings
development:
  # Enable development mode
  mode: false

  # Mock API responses for testing
  mock_api: false

  # Verbose error messages
  verbose_errors: false

  # Performance profiling
  profiling: false

# =============================================================================
# MONITORING AND METRICS
# =============================================================================

# Monitoring and metrics collection
monitoring:
  # Enable metrics collection
  enabled: false

  # Metrics endpoint
  endpoint: ""

  # Metrics collection interval
  interval: 60

  # Enable health checks
  health_checks: true

# =============================================================================
# BACKUP AND RECOVERY
# =============================================================================

# Backup and recovery settings
backup:
  # Enable automatic backups
  enabled: false

  # Backup directory
  directory: ""

  # Backup frequency in hours
  frequency: 24

  # Maximum backup files to keep
  max_files: 7

# =============================================================================
# INTEGRATION SETTINGS
# =============================================================================

# Third-party integrations
integrations:
  # Slack integration
  slack:
    enabled: false
    webhook_url: ""
    channel: ""

  # Jira integration
  jira:
    enabled: false
    url: ""
    username: ""
    api_token: ""

  # GitHub integration
  github:
    enabled: false
    token: ""
    repository: ""

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Advanced configuration options
advanced:
  # Custom headers for API requests
  custom_headers: {}

  # Request timeout multipliers
  timeout_multipliers:
    connect: 1.0
    read: 1.0
    write: 1.0

  # Retry backoff strategy
  retry_backoff:
    strategy: "exponential"
    multiplier: 2.0
    max_delay: 60.0

  # Connection pooling settings
  connection_pool:
    max_keepalive: 10
    keepalive_timeout: 30

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================

# Environment-specific configuration
# These values can be overridden by environment variables
environment:
  # Current environment (development, staging, production)
  name: "development"

  # Environment-specific settings
  overrides:
    # Example: production overrides
    production:
      ai:
        enabled: true
      logging:
        level: "WARNING"
      cache:
        enabled: true
        ttl: 600

    # Example: development overrides
    development:
      debug: true
      mock_api: false
      verbose_errors: true

# =============================================================================
# DOCUMENTATION AND HELP
# =============================================================================

# Help and documentation settings
help:
  # Show help on startup
  show_on_startup: false

  # Documentation URL
  docs_url: "https://github.com/your-org/youtrack-mcp"

  # Support contact
  support_contact: "support@yourcompany.com"

# =============================================================================
# VERSION AND COMPATIBILITY
# =============================================================================

# Version and compatibility information
version:
  # Configuration format version
  config_version: "1.0"

  # Minimum server version required
  min_server_version: "1.0.0"

  # Compatible YouTrack versions
  compatible_youtrack_versions:
    - "2023.1+"
    - "2024.1+"

  # API compatibility
  api_compatibility:
    - "rest-api-1"
    - "rest-api-2"
    - "commands-api"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================

# Notes:
# - Environment variables override YAML values (prefix: YOUTRACK_, MCP_, etc.)
# - Sensitive values like API tokens should use environment variables or token_file
# - Comment out unused sections to keep configuration clean
# - Use config.example.yaml as a template for new deployments
# - Validate configuration with: python -c "from youtrack_mcp.config import config; config.validate()"