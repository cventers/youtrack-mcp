# YouTrack MCP Server Configuration
# This file demonstrates the new simplified configuration structure

youtrack:
  url: https://example.youtrack.cloud  # Your YouTrack instance URL
  # api_token: ${YOUTRACK_API_TOKEN}   # Can reference env vars (uncomment to use)
  cloud: true                          # Set to true for cloud instances
  verify_ssl: true                     # Verify SSL certificates
  max_retries: 3                       # Maximum retry attempts
  retry_delay: 1.0                     # Retry delay in seconds
  token_ttl_seconds: 3600              # Token cache TTL
  enable_token_refresh: true           # Enable auto token refresh

mcp:
  server_name: youtrack-mcp
  server_description: YouTrack MCP Server
  debug: false

openai:
  # api_key: ${OPENAI_API_KEY}         # Uncomment and set your API key
  base_url: https://api.openai.com
  model: gpt-4o-mini
  max_tokens: 1000                     # Maximum tokens for completion
  temperature: 0.3
  timeout: 30
  # Note: LLM_ENABLED is set via environment variable

cache:
  enabled: true
  ttl: 300
  max_size: 100

logging:
  level: INFO
  # file: /var/log/youtrack-mcp.log    # Uncomment to enable file logging
  console_disable: false

display:
  timezone: America/Chicago             # Timezone for date/time operations